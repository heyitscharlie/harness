# Runs the agent eval suite on every push to main and every pull request.
# A prompt or model change that breaks behaviour turns the build red.
name: Evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
